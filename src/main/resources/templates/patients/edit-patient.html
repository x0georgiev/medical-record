<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head"></head>
<body>
<nav th:replace="fragments :: navigation"></nav>
<div class="container mt-4">
    <h4>Edit Patient</h4>
    <div class="col-6">
        <form action="#" th:action="@{/patients/update/{id}(id=${patientId})}" th:object="${patient}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input class="form-control" type="text" th:field="*{name}" id="name">
                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="mb-3">
                <label for="egn" class="form-label">EGN (10 digits)</label>
                <input class="form-control" type="text" th:field="*{egn}" id="egn">
                <span class="text-danger" th:if="${#fields.hasErrors('egn')}" th:errors="*{egn}"></span>
            </div>
            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" th:field="*{healthInsurancePaid}" id="healthInsurancePaid">
                <label class="form-check-label" for="healthInsurancePaid">Health Insurance Paid</label>
            </div>
            <div class="mb-3">
                <label for="lastInsurancePaymentDate" class="form-label">Last Insurance Payment Date</label>
                <input class="form-control" type="date" th:field="*{lastInsurancePaymentDate}" id="lastInsurancePaymentDate">
            </div>
            <div class="mb-3">
                <label for="generalPractitionerId" class="form-label">General Practitioner</label>
                <select class="form-select" th:field="*{generalPractitionerId}" id="generalPractitionerId">
                    <option value="">-- Select GP --</option>
                    <option th:each="doctor : ${doctors}" th:value="${doctor.id}" th:text="${doctor.name}"></option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('generalPractitionerId')}" th:errors="*{generalPractitionerId}"></span>
            </div>
            <button type="submit" class="btn btn-primary">Update Patient</button>
            <a href="/patients" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
<footer th:replace="fragments :: footer"></footer>
</body>
</html>
