services:
  app:
    build: .
    container_name: medical-record-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/medical_record?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medical-net

  db:
    image: mysql:8.0
    container_name: medical-record-db
    ports:
      - "3307:3306" # Mapped to 3307 on host to avoid conflict if you have local MySQL
    environment:
      - MYSQL_DATABASE=medical_record
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - medical-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  medical-net:
    driver: bridge

volumes:
  db_data:
