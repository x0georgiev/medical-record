spring.security.oauth2.client.registration.pharmacy-application.client-id=pharmacy-application
spring.security.oauth2.client.registration.pharmacy-application.client-secret=IO9QNkTBZzw1ITaIKrzEiPHXBIgYgyaL
spring.security.oauth2.client.registration.pharmacy-application.scope=openid, profile, roles
spring.security.oauth2.client.registration.pharmacy-application.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.pharmacy-application.redirect-uri=http://localhost:8084/login/oauth2/code/pharmacy-security-keycloack

spring.security.oauth2.client.provider.pharmacy-application.issuer-uri=http://localhost:8080/realms/pharmacy-application-realm
spring.security.oauth2.client.provider.pharmacy-application.token-uri=http://localhost:8080/realms/pharmacy-application-realm/protocol/openid-connect/token
spring.security.oauth2.client.provider.pharmacy-application.jwk-set-uri=http://localhost:8080/realms/pharmacy-application-realm/protocol/openid-connect/certs
spring.security.oauth2.client.provider.pharmacy-application.user-info-uri=http://localhost:8080/realms/pharmacy-application-realm/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.pharmacy-application.username-attribute=preferred_username

spring.security.oauth2.resource.jwt.issuer-uri=http://localhost:8080/realms/pharmacy-application-realm
spring.security.oauth2.resource.jwt.jwk-set-uri=http://localhost:8080/realms/pharmacy-application-realm/protocol/openid-connect/certs